name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  verificar:
    name: Testes e build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Precisa bater com a major que gerou o package-lock.json (npm 11 / Node 24):
      # npm 10 resolve peer deps opcionais de outro jeito e quebra o `npm ci`.
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes
        run: npm test -- --watchAll=false --passWithNoTests
        env:
          CI: true

      - name: Build de produção
        run: npm run build
